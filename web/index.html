<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenFlexure Camera Viewer</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="shell">
    <section class="viewer-app" aria-label="OpenFlexure camera viewer">
      <header class="app-header">
        <div class="brand-lockup">
          <div class="brand-mark" aria-hidden="true">
            <img class="brand-logo" src="/titleiconpink.svg" alt="">
          </div>
          <div>
            <p class="eyebrow">OpenFlexure Microscope</p>
            <h1>Camera Stream</h1>
          </div>
        </div>
        <p class="status" id="status">Connecting to camera stream…</p>
      </header>

      <section class="stream-panel">
        <div class="stream-frame">
          <img id="stream" src="/camera/mjpeg_stream" alt="Live camera stream">
        </div>
      </section>

      <footer class="toolbar">
        <button id="savePhoto" type="button" disabled>Save photo</button>
      </footer>
    </section>
  </main>

  <canvas id="captureCanvas" hidden></canvas>
  <script src="/app.js" defer></script>
</body>
</html>
