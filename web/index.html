<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenFlexure Camera Viewer</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="shell">
    <section class="viewer-app" aria-label="OpenFlexure camera viewer">
      <header class="app-header">
        <div class="brand-lockup">
          <div class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 160 160" role="img" focusable="false" aria-hidden="true">
              <path class="brand-shape" d="M80 14c26 0 47 13 58 32 4 6 6 13 6 20 0 7-2 13-5 19l-17-8c-3-1-6-1-8 2l-7 9c-3 4-4 9-2 13l12 29c-11 4-23 6-37 6s-26-2-37-6l12-29c2-4 1-9-2-13l-7-9c-2-3-5-4-8-2l-17 8c-3-6-5-12-5-19 0-7 2-14 6-20 11-19 32-32 58-32z"></path>
              <circle class="brand-hole" cx="80" cy="72" r="28"></circle>
              <path class="brand-cut" d="M80 98 102 146H58z"></path>
            </svg>
          </div>
          <div>
            <p class="eyebrow">OpenFlexure Microscope</p>
            <h1>Camera Stream</h1>
          </div>
        </div>
        <p class="status" id="status">Connecting to camera stream…</p>
      </header>

      <section class="stream-panel">
        <div class="stream-frame">
          <img id="stream" src="/camera/mjpeg_stream" alt="Live camera stream">
        </div>
      </section>

      <footer class="toolbar">
        <button id="savePhoto" type="button" disabled>Save photo</button>
      </footer>
    </section>
  </main>

  <canvas id="captureCanvas" hidden></canvas>
  <script src="/app.js" defer></script>
</body>
</html>
